# Arma el APK de Satélite (la mini app Android de Orbe) y lo publica como versión en GitHub.
# Firma: con el secreto SATELITE_CLAVE (una frase larga que solo sabés vos), la primera vez se crea la firma,
# se guarda CIFRADA en satelite/firma.enc y desde ahí todas las versiones salen con la misma (se instalan encima).
# Sin el secreto, sale una versión de prueba con una firma descartable.
name: Satélite (APK)

on:
  push:
    branches: [main]
    paths: ["satelite/**", ".github/workflows/satelite.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: satelite
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satelite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Firma
        env:
          CLAVE: ${{ secrets.SATELITE_CLAVE }}
        run: |
          if [ -n "$CLAVE" ]; then
            if [ -f firma.enc ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in firma.enc -out app/firma.jks -pass env:CLAVE
            else
              keytool -genkeypair -keystore app/firma.jks -storetype PKCS12 -alias satelite -keyalg RSA -keysize 3072 \
                -validity 20000 -storepass "$CLAVE" -keypass "$CLAVE" -dname "CN=Satelite, O=Orbe, C=AR"
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in app/firma.jks -out firma.enc -pass env:CLAVE
              echo "NUEVA=1" >> "$GITHUB_ENV"
            fi
            echo "PRUEBA=0" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 24)
            echo "::add-mask::$P"
            keytool -genkeypair -keystore app/firma.jks -storetype PKCS12 -alias satelite -keyalg RSA -keysize 2048 \
              -validity 400 -storepass "$P" -keypass "$P" -dname "CN=Satelite prueba, O=Orbe, C=AR"
            echo "$P" > /tmp/clave-prueba
            echo "PRUEBA=1" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        env:
          CLAVE: ${{ secrets.SATELITE_CLAVE }}
          SAT_FIRMA: firma.jks
        run: |
          if [ -z "$CLAVE" ]; then CLAVE=$(cat /tmp/clave-prueba); fi
          export SAT_CLAVE="$CLAVE"
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee ../armado.log
          cp app/build/outputs/apk/release/app-release.apk ../Satelite.apk

      - name: Guardar la firma cifrada
        if: env.NUEVA == '1'
        working-directory: .
        run: |
          git config user.name "Satélite (GitHub)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satelite/firma.enc
          git commit -m "Satélite: firma cifrada (la llave es el secreto SATELITE_CLAVE)"
          git push

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: satelite-v1.0.${{ github.run_number }}
          name: Satélite 1.0.${{ github.run_number }}${{ env.PRUEBA == '1' && ' (prueba)' || '' }}
          body: |
            Bajá Satelite.apk desde el celu e instalalo.
            ${{ env.PRUEBA == '1' && 'Versión de prueba: tiene una firma descartable. Cuando cargues el secreto SATELITE_CLAVE, desinstalá esta antes de instalar la siguiente.' || 'Se instala encima de la anterior sin perder nada.' }}
          files: Satelite.apk
          make_latest: true

      - name: Dejar el registro si falló
        if: failure()
        working-directory: .
        run: |
          mkdir -p /tmp/log
          cp armado.log /tmp/log/armado.log 2>/dev/null || echo "sin registro" > /tmp/log/armado.log
          grep -nE "error:|FAILED|What went wrong|e: |AAPT" /tmp/log/armado.log | head -80 > /tmp/log/errores.txt || true
          git config user.name "Satélite (GitHub)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan satelite-log
          git rm -rf -q . || true
          cp /tmp/log/armado.log /tmp/log/errores.txt .
          git add armado.log errores.txt
          git commit -q -m "Registro del armado ${{ github.run_number }}"
          git push -f origin satelite-log
